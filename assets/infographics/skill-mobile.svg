<svg xmlns="http://www.w3.org/2000/svg" width="400" height="736" viewBox="0 0 400 736" role="img" aria-labelledby="title desc"><title id="title">Take the review instructions with you</title><desc id="desc">The downloadable SKILL.md carries the rubric and review procedure. Bring the document: Use the lesson plan, syllabus, or combined scope. Ask for evidence: Use exact passages and explain uncertain ratings. Check the review: Verify the reasoning before choosing a revision. Includes rating explanations, score calculations, and screen-time review guidance.</desc><rect width="400" height="736" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="24" y="63" font-size="26" fill="#142d4e" font-weight="750">Take the review</text><text x="24" y="95" font-size="26" fill="#142d4e" font-weight="750">instructions with you</text><text x="24" y="127" font-size="18" fill="#4b6078" font-weight="400">The downloadable SKILL.md carries</text><text x="24" y="152" font-size="18" fill="#4b6078" font-weight="400">the rubric and review procedure.</text><rect x="24.0" y="195" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="195" width="352.0" height="5" rx="2" fill="#215bc7"/><circle cx="55.0" cy="228" r="18" fill="#215bc7"/><text x="44.0" y="234" font-size="17" fill="white" font-weight="750">01</text><text x="86.0" y="233" font-size="20" fill="#142d4e" font-weight="750">Bring the document</text><text x="42.0" y="270" font-size="18" fill="#4b6078" font-weight="400">Use the lesson plan, syllabus, or</text><text x="42.0" y="294" font-size="18" fill="#4b6078" font-weight="400">combined scope.</text><rect x="24.0" y="334" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="334" width="352.0" height="5" rx="2" fill="#087f72"/><circle cx="55.0" cy="367" r="18" fill="#087f72"/><text x="44.0" y="3