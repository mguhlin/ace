<svg xmlns="http://www.w3.org/2000/svg" width="400" height="712" viewBox="0 0 400 712" role="img" aria-labelledby="title desc"><title id="title">Align three parts of the plan</title><desc id="desc">Start with the understanding you want students to show. Learning goal: Explain how sample selection affects conclusions. Demonstration task: Evaluate a different survey using that relationship. Success criteria: Support the conclusion and explain a limit. Goal → task → success criteria: ask for the same kind of thinking.</desc><rect width="400" height="712" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="24" y="63" font-size="26" fill="#142d4e" font-weight="750">Align three parts of the</text><text x="24" y="95" font-size="26" fill="#142d4e" font-weight="750">plan</text><text x="24" y="127" font-size="18" fill="#4b6078" font-weight="400">Start with the understanding you</text><text x="24" y="152" font-size="18" fill="#4b6078" font-weight="400">want students to show.</text><rect x="24.0" y="195" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="195" width="352.0" height="5" rx="2" fill="#215bc7"/><circle cx="55.0" cy="228" r="18" fill="#215bc7"/><text x="44.0" y="234" font-size="17" fill="white" font-weight="750">01</text><text x="86.0" y="233" font-size="20" fill="#142d4e" font-weight="750">Learning goal</text><text x="42.0" y="270" font-size="18" fill="#4b6078" font-weight="400">Explain how sample selection</text><text x="42.0" y="294" font-size="18" fill="#4b6078" font-weight="400">affects conclusions.</text><rect x="24.0" y="334" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="334" width="352.0" height="5" rx="2" fill="#087f72"/><circle cx="55.0" cy="367" r="18" fill="#087f72"/><text x="44.0" y="373" font-size="17" fill="white" font-weight="750">02</text><text x="86.0" y="372" font-size="20" fill="#142d4e" font-weight="750">Demonstration task</text><text x="42.0" y="409" font-size="18" fill="#4b6078" font-weight="400">Evaluate a different survey using</text><text x="42.0" y="433" font-size="18" fill="#4b6078" font-weight="400">that relationship.</text><rect x="24.0" y="473" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="473" width="352.0" height="5" rx="2" fill="#96590b"/><circle cx="55.0" cy="506" r="18" fill="#96590b"/><text x="44.0" y="512" font-size="17" fill="white" font-weight="750">03</text><text x="86.0" y="511" font-size="20" fill="#142d4e" font-weight="750">Success criteria</text><text x="42.0" y="548" font-size="18" fill="#4b6078" font-weight="400">Support the conclusion and</text><text x="42.0" y="572" font-size="18" fill="#4b6078" font-weight="400">explain a limit.</text><rect x="24" y="612" width="352" height="76" rx="10" fill="#142d4e"/><text x="40" y="641" font-size="17" fill="white" font-weight="500">Goal → task → success criteria:</text><text x="40" y="665" font-size="17" fill="white" font-weight="500">ask for the same kind of thinking.</text></g></svg>