<svg xmlns="http://www.w3.org/2000/svg" width="960" height="494" viewBox="0 0 960 494" role="img" aria-labelledby="title desc"><title id="title">Read the structure of the response</title><desc id="desc">SOLO describes the understanding a student demonstrates. Prestructural: Misses the task Unistructural: One relevant aspect Multistructural: Several separate aspects Relational: A coherent explanation Extended abstract: A broader claim with limits More facts alone do not establish deeper understanding. Look at the links.</desc><rect width="960" height="494" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="32" y="63" font-size="32" fill="#142d4e" font-weight="750">Read the structure of the response</text><text x="32" y="102" font-size="20" fill="#4b6078" font-weight="400">SOLO describes the understanding a student demonstrates.</text><rect x="32.0" y="185" width="164.8" height="215" rx="12" fill="white" stroke="#cbd8e8"/><rect x="32.0" y="185" width="164.8" height="5" rx="2" fill="#52647c"/><circle cx="66.0" cy="221" r="20" fill="#52647c"/><text x="54.0" y="228" font-size="19" fill="white" font-weight="750">1</text><text x="48.0" y="268" font-size="19" fill="#142d4e" font-weight="750">Prestructural</text><text x="48.0" y="325" font-size="17" fill="#4b6078" font-weight="400">Misses the</text><text x="48.0" y="349" font-size="17" fill="#4b6078" font-weight="400">task</text><rect x="214.8" y="175" width="164.8" height="215" rx="12" fill="white" stroke="#cbd8e8"/><rect x="214.8" y="175" width="164.8" height="5" rx="2" fill="#215bc7"/><circle cx="248.8" cy="211" r="20" fill="#215bc7"/><text x="236.8" y="218" font-size="19" fill="white" font-weight="750">2</text><text x="230.8" y="258" font-size="19" fill="#142d4e" font-weight="750">Unistructural</text><text x="230.8" y="315" font-size="17" fill="#4b6078" font-weight="400">One relevant