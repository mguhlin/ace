<svg xmlns="http://www.w3.org/2000/svg" width="400" height="851" viewBox="0 0 400 851" role="img" aria-labelledby="title desc"><title id="title">Turn instructional strategies into actions</title><desc id="desc">Give students a chance to use the support you provide. Model thinking: Show how you check your reasoning. Give feedback: Name a specific move the student can make. Let students revise: Ask what improved and why. Compare cases: Ask when a principle applies and when it fails. The opportunity to act on feedback belongs inside the assignment.</desc><rect width="400" height="851" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="24" y="63" font-size="26" fill="#142d4e" font-weight="750">Turn instructional</text><text x="24" y="95" font-size="26" fill="#142d4e" font-weight="750">strategies into actions</text><text x="24" y="127" font-size="18" fill="#4b6078" font-weight="400">Give students a chance to use the</text><text x="24" y="152" font-size="18" fill="#4b6078" font-weight="400">support you provide.</text><rect x="24.0" y="195" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="195" width="352.0" height="5" rx="2" fill="#215bc7"/><circle cx="55.0" cy="228" r="18" fill="#215bc7"/><text x="44.0" y="234" font-size="17" fill="white" font-weight="750">01</text><text x="86.0" y="233" font-size="20" fill="#142d4e" font-weight="750">Model thinking</text><text x="42.0" y="270" font-size="18" fill="#4b6078" font-weight="400">Show how you check your</text><text x="42.0" y="294" font-size="18" fill="#4b6078" font-weight="400">reasoning.</text><rect x="24.0" y="334" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="334" width="352.0" height="5" rx="2" fill="#087f72"/><circle cx="55.0" cy="367" r="18" fill="#087f72"/><text x="44.0" y="373" font-size="17" fill="white" font-weight="750">02</text><text x="86.0" y="372" font-size="20" fill="#142d4e" font-weight="750">Give feedback</text><text x="42.0" y="409" font-size="18" fill="#4b6078" font-weight="400">Name a specific move the student</text><text x="42.0" y="433" font-size="18" fill="#4b6078" font-weight="400">can make.</text><rect x="24.0" y="473" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="473" width="352.0" height="5" rx="2" fill="#96590b"/><circle cx="55.0" cy="506" r="18" fill="#96590b"/><text x="44.0" y="512" font-size="17" fill="white" font-weight="750">03</text><text x="86.0" y="511" font-size="20" fill="#142d4e" font-weight="750">Let students revise</text><text x="42.0" y="548" font-size="18" fill="#4b6078" font-weight="400">Ask what improved and why.</text><rect x="24.0" y="612" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="612" width="352.0" height="5" rx="2" fill="#6950a3"/><circle cx="55.0" cy="645" r="18" fill="#6950a3"/><text x="44.0" y="651" font-size="17" fill="white" font-weight="750">04</text><text x="86.0" y="650" font-size="20" fill="#142d4e" font-weight="750">Compare cases</text><text x="42.0" y="687" font-size="18" fill="#4b6078" font-weight="400">Ask when a principle applies and</text><text x="42.0" y="711" font-size="18" fill="#4b6078" font-weight="400">when it fails.</text><rect x="24" y="751" width="352" height="76" rx="10" fill="#142d4e"/><text x="40" y="780" font-size="17" fill="white" font-weight="500">The opportunity to act on feedback</text><text x="40" y="804" font-size="17" fill="white" font-weight="500">belongs inside the assignment.</text></g></svg>