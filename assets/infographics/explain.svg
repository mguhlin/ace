<svg xmlns="http://www.w3.org/2000/svg" width="960" height="439" viewBox="0 0 960 439" role="img" aria-labelledby="title desc"><title id="title">Listen for the thinking</title><desc id="desc">Use student explanations to decide what to teach next. Explain an idea: Ask for an example in the student’s own words. Show a connection: Ask how or why two ideas work together. Test the reasoning: Change a condition and ask what still holds. A polished product is one piece of evidence. Add short learning checkpoints.</desc><rect width="960" height="439" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="32" y="63" font-size="32" fill="#142d4e" font-weight="750">Listen for the thinking</text><text x="32" y="102" font-size="20" fill="#4b6078" font-weight="400">Use student explanations to decide what to teach next.</text><rect x="32.0" y="145" width="286.6666666666667" height="200" rx="12" fill="white" stroke="#cbd8e8"/><rect x="32.0" y="145" width="286.6666666666667" height="5" rx="2" fill="#215bc7"/><circle cx="66.0" cy="181" r="20" fill="#215bc7"/><text x="54.0" y="188" font-size="19" fill="white" font-weight="750">01</text><text x="48.0" y="228" font-size="22" fill="#142d4e" font-weight="750">Explain an idea</text><text x="48.0" y="259" font-size="19" fill="#4b6078" font-weight="400">Ask for an example in the</text><text x="48.0" y="283" font-size="19" fill="#4b6078" font-weight="400">student’s own words.</text><rect x="336.6666666666667" y="145" width="286.6666666666667" height="200" rx="12" fill="white" stroke="#cbd8e8"/><rect x="336.6666666666667" y="145" width="286.6666666666667" height="5" rx="2" fill="#087f72"/><circle cx="370.6666666666667" cy="181" r="20" fill="#087f72"/><text x="358.6666666666667" y="188" font-size="19" fill="white" font-weight="750">02</text><text x="352.6666666666667" y="228" font-size="22" fill="#142d4e" font-weight="750">Show a connection</text><text x="352.6666666666667" y="259" font-size="19" fill="#4b6078" font-weight="400">Ask how or why two ideas</text><text x="352.6666666666667" y="283" font-size="19" fill="#4b6078" font-weight="400">work together.</text><rect x="641.3333333333334" y="145" width="286.6666666666667" height="200" rx="12" fill="white" stroke="#cbd8e8"/><rect x="641.3333333333334" y="145" width="286.6666666666667" height="5" rx="2" fill="#96590b"/><circle cx="675.3333333333334" cy="181" r="20" fill="#96590b"/><text x="663.3333333333334" y="188" font-size="19" fill="white" font-weight="750">03</text><text x="657.3333333333334" y="228" font-size="22" fill="#142d4e" font-weight="750">Test the reasoning</text><text x="657.3333333333334" y="259" font-size="19" fill="#4b6078" font-weight="400">Change a condition and</text><text x="657.3333333333334" y="283" font-size="19" fill="#4b6078" font-weight="400">ask what still holds.</text><rect x="32" y="363" width="896" height="52" rx="10" fill="#142d4e"/><text x="48" y="392" font-size="17" fill="white" font-weight="500">A polished product is one piece of evidence. Add short learning checkpoints.</text></g></svg>