<svg xmlns="http://www.w3.org/2000/svg" width="400" height="704" viewBox="0 0 400 704" role="img" aria-labelledby="title desc"><title id="title">Listen for the thinking</title><desc id="desc">Use student explanations to decide what to teach next. Explain an idea: Ask for an example in the student’s own words. Show a connection: Ask how or why two ideas work together. Test the reasoning: Change a condition and ask what still holds. A polished product is one piece of evidence. Add short learning checkpoints.</desc><rect width="400" height="704" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="24" y="63" font-size="26" fill="#142d4e" font-weight="750">Listen for the thinking</text><text x="24" y="95" font-size="18" fill="#4b6078" font-weight="400">Use student explanations to decide</text><text x="24" y="120" font-size="18" fill="#4b6078" font-weight="400">what to teach next.</text><rect x="24.0" y="163" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="163" width="352.0" height="5" rx="2" fill="#215bc7"/><circle cx="55.0" cy="196" r="18" fill="#215bc7"/><text x="44.0" y="202" font-size="17" fill="white" font-weight="750">01</text><text x="86.0" y="201" font-size="20" fill="#142d4e" font-weight="750">Explain an idea</text><text x="42.0" y="238" font-size="18" fill="#4b6078" font-weight="400">Ask for an example in the</text><text x="42.0" y="262" font-size="18" fill="#4b6078" font-weight="400">student’s own words.</text><rect x="24.0" y="302" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="302" width="352.0" height="5" rx="2" fill="#087f72"/><circle cx="55.0" cy="335" r="18" fill="#087f72"/><text x="44.0" y="341" font-size="17" fill="white" font-weight="750">02</text><text x="86.0" y="340" font-size="20" fill="#142d4e" font-weight="750">Show a connection</text><text x="42.0" y="377" font-size="18" fill="#4b6078" font-weight="400">Ask how or why two ideas work</text><text x="42.0" y="401" font-size="18" fill="#4b6078" font-weight="400">together.</text><rect x="24.0" y="441" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="441" width="352.0" height="5" rx="2" fill="#96590b"/><circle cx="55.0" cy="474" r="18" fill="#96590b"/><text x="44.0" y="480" font-size="17" fill="white" font-weight="750">03</text><text x="86.0" y="479" font-size="20" fill="#142d4e" font-weight="750">Test the reasoning</text><text x="42.0" y="516" font-size="18" fill="#4b6078" font-weight="400">Change a condition and ask what</text><text x="42.0" y="540" font-size="18" fill="#4b6078" font-weight="400">still holds.</text><rect x="24" y="580" width="352" height="100" rx="10" fill="#142d4e"/><text x="40" y="609" font-size="17" fill="white" font-weight="500">A polished product is one piece of</text><text x="40" y="633" font-size="17" fill="white" font-weight="500">evidence. Add short learning</text><text x="40" y="657" font-size="17" fill="white" font-weight="500">checkpoints.</text></g></svg>