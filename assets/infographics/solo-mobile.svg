<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1014" viewBox="0 0 400 1014" role="img" aria-labelledby="title desc"><title id="title">Read the structure of the response</title><desc id="desc">SOLO describes the understanding a student demonstrates. Prestructural: Misses the task Unistructural: One relevant aspect Multistructural: Several separate aspects Relational: A coherent explanation Extended abstract: A broader claim with limits More facts alone do not establish deeper understanding. Look at the links.</desc><rect width="400" height="1014" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="24" y="63" font-size="26" fill="#142d4e" font-weight="750">Read the structure of the</text><text x="24" y="95" font-size="26" fill="#142d4e" font-weight="750">response</text><text x="24" y="127" font-size="18" fill="#4b6078" font-weight="400">SOLO describes the understanding a</text><text x="24" y="152" font-size="18" fill="#4b6078" font-weight="400">student demonstrates.</text><rect x="24.0" y="195" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="195" width="352.0" height="5" rx="2" fill="#52647c"/><circle cx="55.0" cy="228" r="18" fill="#52647c"/><text x="44.0" y="234" font-size="17" fill="white" font-weight="750">1</text><text x="86.0" y="233" font-size="20" fill="#142d4e" font-weight="750">Prestructural</text><text x="42.0" y="270" font-size="18" fill="#4b6078" font-weight="400">Misses the task</text><rect x="24.0" y="334" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="334" width="352.0" height="5" rx="2" fill="#215bc7"/><circle cx="55.0" cy="367" r="18" fill="#215bc7"/><text x="44.0" y="373" font-size="17" fill="white" font-weight="750">2</text><text x="86.0" y="372" font-size="20" fill="#142d4e" font-weight="750">Unistructural</text><text x="42.0" y="409" font-size="18" fill="#4b6078" font-weight="400">One relevant aspect</text><rect x="24.0" y="473" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="473" width="352.0" height="5" rx="2" fill="#215bc7"/><circle cx="55.0" cy="506" r="18" fill="#215bc7"/><text x="44.0" y="512" font-size="17" fill="white" font-weight="750">3</text><text x="86.0" y="511" font-size="20" fill="#142d4e" font-weight="750">Multistructural</text><text x="42.0" y="548" font-size="18" fill="#4b6078" font-weight="400">Several separate aspects</text><rect x="24.0" y="612" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="612" width="352.0" height="5" rx="2" fill="#087f72"/><circle cx="55.0" cy="645" r="18" fill="#087f72"/><text x="44.0" y="651" font-size="17" fill="white" font-weight="750">4</text><text x="86.0" y="650" font-size="20" fill="#142d4e" font-weight="750">Relational</text><text x="42.0" y="687" font-size="18" fill="#4b6078" font-weight="400">A coherent explanation</text><rect x="24.0" y="751" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="751" width="352.0" height="5" rx="2" fill="#96590b"/><circle cx="55.0" cy="784" r="18" fill="#96590b"/><text x="44.0" y="790" font-size="17" fill="white" font-weight="750">5</text><text x="86.0" y="789" font-size="20" fill="#142d4e" font-weight="750">Extended abstract</text><text x="42.0" y="826" font-size="18" fill="#4b6078" font-weight="400">A broader claim with limits</text><rect x="24" y="890" width="352" height="100" rx="10" fill="#142d4e"/><text x="40" y="919" font-size="17" fill="white" font-weight="500">More facts alone do not establish</text><text x="40" y="943" font-size="17" fill="white" font-weight="500">deeper understanding. Look at the</text><text x="40" y="967" font-size="17" fill="white" font-weight="500">links.</text></g></svg>