<svg xmlns="http://www.w3.org/2000/svg" width="400" height="815" viewBox="0 0 400 815" role="img" aria-labelledby="title desc"><title id="title">Make the review a shared conversation</title><desc id="desc">Show the criteria, discuss the evidence, and choose a change. Present review for the team. Save PDF for color charts and supporting passages.</desc><rect width="400" height="815" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="24" y="63" font-size="26" fill="#142d4e" font-weight="750">Make the review a shared</text><text x="24" y="95" font-size="26" fill="#142d4e" font-weight="750">conversation</text><text x="24" y="127" font-size="18" fill="#4b6078" font-weight="400">Show the criteria, discuss the</text><text x="24" y="152" font-size="18" fill="#4b6078" font-weight="400">evidence, and choose a change.</text><rect x="24" y="195" width="352" height="208" rx="12" fill="#ffffff" stroke="#cbd8e8"/><text x="40" y="224" font-size="18" fill="#142d4e" font-weight="700">Illustrative rubric ratings</text><text x="40" y="250" font-size="16" fill="#142d4e" font-weight="400">Goal-to-task fit</text><rect x="40" y="258" width="246" height="12" rx="6" fill="#e3eaf4"/><rect x="40" y="258" width="246.0" height="12" rx="6" fill="#215bc7"/><text x="296" y="269" font-size="15" fill="#142d4e" font-weight="400">3/3</text><text x="40" y="297" font-size="16" fill="#142d4e" font-weight="400">Concept explanation</text><rect x="40" y="305" width="246" height="12" rx="6" fill="#e3eaf4"/><rect x="40" y="305" width="164.0" height="12" rx="6" fill="#087f72"/><text x="296" y="316" font-size="15" fill="#142d4e" font-weight="400">2/3</text><text x="40" y="344" font-size="16" fill="#142d4e" font-weight="400">Reasoned relationships</text><rect x="40" y="352" width="246" height="12" rx="6" fill="#e3eaf4"/><rect x="40" y="352" width="82.0" height="12" rx="6" fill="#96590b"/><text x="296" y="363" font-size="15" fill="#142d4e" font-weight="400">1/3</text><circle cx="192" cy="509" r="64" fill="none" stroke="#e3eaf4" stroke-width="28"/><circle cx="192" cy="509" r="64" fill="none" stroke="#087f72" stroke-width="28" stroke-dasharray="201 402" transform="rotate(-90 192 509)"/><text x="148" y="508" font-size="20" fill="#142d4e" font-weight="700">Rubric</text><text x="151" y="533" font-size="20" fill="#142d4e" font-weight="700">points</text><text x="24" y="607" font-size="17" fill="#4b6078" font-weight="400">Chart percentages describe</text><text x="24" y="631" font-size="17" fill="#4b6078" font-weight="400">documented design, not student</text><text x="24" y="655" font-size="17" fill="#4b6078" font-weight="400">achievement.</text><rect x="24" y="691" width="352" height="100" rx="10" fill="#142d4e"/><text x="40" y="720" font-size="17" fill="white" font-weight="500">Present review for the team. Save</text><text x="40" y="744" font-size="17" fill="white" font-weight="500">PDF for color charts and</text><text x="40" y="768" font-size="17" fill="white" font-weight="500">supporting passages.</text></g></svg>