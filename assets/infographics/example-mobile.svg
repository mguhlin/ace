<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1146" viewBox="0 0 400 1146" role="img" aria-labelledby="title desc"><title id="title">Try the routine in history</title><desc id="desc">Use the causes of the French Revolution to make reasoning visible. Explain two causes: Describe economic pressure and political legitimacy. Support the interaction: Use course sources, then revise a weak link. Test a broader claim: Compare another case and explain where the claim fails. Finish with a brief individual explanation to decide what students need next.</desc><rect width="400" height="1146" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="24" y="63" font-size="26" fill="#142d4e" font-weight="750">Try the routine in history</text><text x="24" y="95" font-size="18" fill="#4b6078" font-weight="400">Use the causes of the French</text><text x="24" y="120" font-size="18" fill="#4b6078" font-weight="400">Revolution to make reasoning</text><text x="24" y="145" font-size="18" fill="#4b6078" font-weight="400">visible.</text><rect x="24.0" y="188" width="352.0" height="266" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="188" width="352.0" height="5" rx="2" fill="#215bc7"/><rect x="24.0" y="188" width="352.0" height="52" rx="12" fill="#215bc7"/><circle cx="54.0" cy="214" r="19" fill="white"/><text x="46.0" y="221" font-size="23" fill="#215bc7" font-weight="750">A</text><text x="84.0" y="221" font-size="20" fill="white" font-weight="750">Explain two causes</text><g transform="translate(301.0 253) scale(0.72)" fill="none" stroke="#215bc7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M8 8 H53 Q61 8 61 17 V38 Q61 47 52 47 H29 L13 59 V47 H8 Q1 47 1 38 V17 Q1 8 8 8 Z"/><circle cx="17" cy="28" r="2"/><circle cx="31" cy="28" r="2"/><circle cx="45" cy="28" r="2"/></g><text x="42.0" y="273" font-size="13" fill="#215bc7" font-weight="750">SAY IT</text><text x="42.0" y="318" font-size="18" fill="#4b6078" font-weight="400">Describe economic</text><text x="42.0" y="343" font-size="18" fill="#4b6078" font-weight="400">pressure and political</text><text x="42.0" y="368" font-size="18" fill="#4b6078" font-weight="400">legitimacy.</text><rect x="36.0" y="387" width="328.0" height="55" rx="8" fill="#edf3fc"/><text x="48.0" y="410" font-size="16" fill="#142d4e" font-weight="500">In my own words, the idea is…</text><rect x="24.0" y="466" width="352.0" height="266" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="466" width="352.0" height="5" rx="2" fill="#087f72"/><rect x="24.0" y="466" width="352.0" height="52" rx="12" fill="#087f72"/><circle cx="54.0" cy="492" r="19" fill="white"/><text x="46.0" y="499" font-size="23" fill="#087f72" font-weight="750">C</text><text x="84.0" y="499" font-size="20" fill="white" font-weight="750">Support the interaction</text><g transform="translate(301.0 531) scale(0.72)" fill="none" stroke="#087f72" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="1" y="25" width="40" height="21" rx="10" transform="rotate(-35 21 35)"/><rect x="25" y="9" width="40" height="21" rx="10" transform="rotate(-35 45 19)"/><path d="M25 34 L43 22"/></g><text x="42.0" y="551" font-size="13" fill="#087f72" font-weight="750">LINK IT</text><text x="42.0" y="596" font-size="18" fill="#4b6078" font-weight="400">Use course sources, then</text><text x="42.0" y="621" font-size="18" fill="#4b6078" font-weight="400">revise a weak link.</text><rect x="36.0" y="665" width="328.0" height="55" rx="8" fill="#edf3fc"/><text x="48.0" y="688" font-size="16" fill="#142d4e" font-weight="500">The ideas connect because…</text><rect x="24.0" y="744" width="352.0" height="266" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="744" width="352.0" height="5" rx="2" fill="#96590b"/><rect x="24.0" y="744" width="352.0" height="52" rx="12" fill="#ffbe35"/><circle cx="54.0" cy="770" r="19" fill="white"/><text x="46.0" y="777" font-size="23" fill="#96590b" font-weight="750">E</text><text x="84.0" y="777" font-size="20" fill="#142d4e" font-weight="750">Test a broader claim</text><g transform="translate(301.0 809) scale(0.72)" fill="none" stroke="#96590b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M20 42 Q18 15 52 2 Q63 34 35 49 Z"/><circle cx="43" cy="20" r="7"/><path d="M20 27 L7 32 L2 49 L20 42 M44 41 L45 57 L28 61 L35 49 M18 48 L8 60 M23 53 L16 65"/></g><text x="42.0" y="829" font-size="13" fill="#96590b" font-weight="750">TEST IT</text><text x="42.0" y="874" font-size="18" fill="#4b6078" font-weight="400">Compare another case and</text><text x="42.0" y="899" font-size="18" fill="#4b6078" font-weight="400">explain where the claim</text><text x="42.0" y="924" font-size="18" fill="#4b6078" font-weight="400">fails.</text><rect x="36.0" y="943" width="328.0" height="55" rx="8" fill="#edf3fc"/><text x="48.0" y="966" font-size="16" fill="#142d4e" font-weight="500">If the case changes, then… The</text><text x="48.0" y="988" font-size="16" fill="#142d4e" font-weight="500">limit is…</text><rect x="24" y="1022" width="352" height="100" rx="10" fill="#142d4e"/><text x="40" y="1051" font-size="17" fill="white" font-weight="500">Finish with a brief individual</text><text x="40" y="1075" font-size="17" fill="white" font-weight="500">explanation to decide what</text><text x="40" y="1099" font-size="17" fill="white" font-weight="500">students need next.</text></g></svg>