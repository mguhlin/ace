<svg xmlns="http://www.w3.org/2000/svg" width="400" height="680" viewBox="0 0 400 680" role="img" aria-labelledby="title desc"><title id="title">One small learning record</title><desc id="desc">Collect a few useful responses as the assignment develops. Initial explanation: What do I understand so far? Connection + revision: What changed after feedback, and why? Application + limit: What works in a changed case, and when? Add a tool-use note: what help did you check, change, or reject?</desc><rect width="400" height="680" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="24" y="63" font-size="26" fill="#142d4e" font-weight="750">One small learning record</text><text x="24" y="95" font-size="18" fill="#4b6078" font-weight="400">Collect a few useful responses as</text><text x="24" y="120" font-size="18" fill="#4b6078" font-weight="400">the assignment develops.</text><rect x="24.0" y="163" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="163" width="352.0" height="5" rx="2" fill="#215bc7"/><circle cx="55.0" cy="196" r="18" fill="#215bc7"/><text x="44.0" y="202" font-size="17" fill="white" font-weight="750">01</text><text x="86.0" y="201" font-size="20" fill="#142d4e" font-weight="750">Initial explanation</text><text x="42.0" y="238" font-size="18" fill="#4b6078" font-weight="400">What do I understand so far?</text><rect x="24.0" y="302" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="302" width="352.0" height="5" rx="2" fill="#087f72"/><circle cx="55.0" cy="335" r="18" fill="#087f72"/><text x="44.0" y="341" font-size="17" fill="white" font-weight="750">02</text><text x="86.0" y="340" font-size="20" fill="#142d4e" font-weight="750">Connection + revision</text><text x="42.0" y="377" font-size="18" fill="#4b6078" font-weight="400">What changed after feedback, and</text><text x="42.0" y="401" font-size="18" fill="#4b6078" font-weight="400">why?</text><rect x="24.0" y="441" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="441" width="352.0" height="5" rx="2" fill="#96590b"/><circle cx="55.0" cy="474" r="18" fill="#96590b"/><text x="44.0" y="480" font-size="17" fill="white" font-weight="750">03</text><text x="86.0" y="479" font-size="20" fill="#142d4e" font-weight="750">Application + limit</text><text x="42.0" y="516" font-size="18" fill="#4b6078" font-weight="400">What works in a changed case, and</text><text x="42.0" y="540" font-size="18" fill="#4b6078" font-weight="400">when?</text><rect x="24" y="580" width="352" height="76" rx="10" fill="#142d4e"/><text x="40" y="609" font-size="17" fill="white" font-weight="500">Add a tool-use note: what help did</text><text x="40" y="633" font-size="17" fill="white" font-weight="500">you check, change, or reject?</text></g></svg>