<svg xmlns="http://www.w3.org/2000/svg" width="960" height="483" viewBox="0 0 960 483" role="img" aria-labelledby="title desc"><title id="title">Make the review a shared conversation</title><desc id="desc">Show the criteria, discuss the evidence, and choose a change. Present review for the team. Save PDF for color charts and supporting passages.</desc><rect width="960" height="483" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="32" y="63" font-size="32" fill="#142d4e" font-weight="750">Make the review a shared conversation</text><text x="32" y="102" font-size="20" fill="#4b6078" font-weight="400">Show the criteria, discuss the evidence, and choose a change.</text><rect x="32" y="145" width="560" height="208" rx="12" fill="#ffffff" stroke="#cbd8e8"/><text x="50" y="174" font-size="18" fill="#142d4e" font-weight="700">Illustrative rubric ratings</text><text x="50" y="200" font-size="16" fill="#142d4e" font-weight="400">Goal-to-task fit</text><rect x="50" y="208" width="450" height="12" rx="6" fill="#e3eaf4"/><rect x="50" y="208" width="450.0" height="12" rx="6" fill="#215bc7"/><text x="510" y="219" font-size="15" fill="#142d4e" font-weight="400">3/3</text><text x="50" y="247" font-size="16" fill="#142d4e" font-weight="400">Concept explanation</text><rect x="50" y="255" width="450" height="12" rx="6" fill="#e3eaf4"/><rect x="50" y="255" width="300.0" height="12" rx="6" fill="#087f72"/><text x="510" y="266" font-size="15" fill="#142d4e" font-weight="400">2/3</text><text x="50" y="294" font-size="16" fill="#142d4e" font-weight="400">Reasoned relationships</text><rect x="50" y="302" width="450" height="12" rx="6" fill="#e3eaf4"/><rect x="50" y="302" width="150.0" height="12" rx="6" fill="#96590b"/><text x="510" y="313" font-size="15" fill="#142d4e" font-weight="400">1/3</text><circle cx="748" cy="241" r="64" fill="none" stroke="#e3eaf4" stroke-width="28"/><circle cx="748" cy="241" r="64" fill="none" stroke="#087f72" stroke-width="28" stroke-dasharray="201 402" transform="rotate(-90 748 241)"/><text x="704" y="240" font-size="20" fill="#142d4e" font-weight="700">Rubric</text><text x="707" y="265" font-size="20" fill="#142d4e" font-weight="700">points</text><text x="32" y="371" font-size="17" fill="#4b6078" font-weight="400">Chart percentages describe documented design, not student achievement.</text><rect x="32" y="407" width="896" height="52" rx="10" fill="#142d4e"/><text x="48" y="436" font-size="17" fill="white" font-weight="500">Present review for the team. Save PDF for color charts and supporting passages.</text></g></svg>