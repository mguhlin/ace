<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1153" viewBox="0 0 400 1153" role="img" aria-labelledby="title desc"><title id="title">Review the evidence, then the rating</title><desc id="desc">Six criteria apply at Extend; four at Articulate and five at Connect. Goal-to-task fit: Does the task reveal the goal? Concept explanation: Can students explain the idea? Reasoned relationships: Do students support the links? Bounded generalization: Can students justify a limit? Instruction + revision: Can feedback change thinking? Individual check: What will you teach next? Read exact passages → adjust 0–3 ratings → confirm → choose an improvement.</desc><rect width="400" height="1153" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="24" y="63" font-size="26" fill="#142d4e" font-weight="750">Review the evidence, then</text><text x="24" y="95" font-size="26" fill="#142d4e" font-weight="750">the rating</text><text x="24" y="127" font-size="18" fill="#4b6078" font-weight="400">Six criteria apply at Extend; four</text><text x="24" y="152" font-size="18" fill="#4b6078" font-weight="400">at Articulate and five at Connect.</text><rect x="24.0" y="195" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="195" width="352.0" height="5" rx="2" fill="#215bc7"/><circle cx="55.0" cy="228" r="18" fill="#215bc7"/><text x="44.0" y="234" font-size="17" fill="white" font-weight="750">01</text><text x="86.0" y="233" font-size="20" fill="#142d4e" font-weight="750">Goal-to-task fit</text><text x="42.0" y="270" font-size="18" fill="#4b6078" font-weight="400">Does the task reveal the goal?</text><rect x="24.0" y="334" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="334" width="352.0" height="5" rx="2" fill="#087f72"/><circle cx="55.0" cy="367" r="18" fill="#087f72"/><text x="44.0" y="373" font-size="17" fill="white" font-weight="750">02</text><text x="86.0" y="372" font-size="20" fill="#142d4e" font-weight="750">Concept explanation</text><text x="42.0" y="409" font-size="18" fill="#4b6078" font-weight="400">Can students explain the idea?</text><rect x="24.0" y="473" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="473" width="352.0" height="5" rx="2" fill="#96590b"/><circle cx="55.0" cy="506" r="18" fill="#96590b"/><text x="44.0" y="512" font-size="17" fill="white" font-weight="750">03</text><text x="86.0" y="511" font-size="20" fill="#142d4e" font-weight="750">Reasoned relationships</text><text x="42.0" y="548" font-size="18" fill="#4b6078" font-weight="400">Do students support the links?</text><rect x="24.0" y="612" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="612" width="352.0" height="5" rx="2" fill="#6950a3"/><circle cx="55.0" cy="645" r="18" fill="#6950a3"/><text x="44.0" y="651" font-size="17" fill="white" font-weight="750">04</text><text x="86.0" y="650" font-size="20" fill="#142d4e" font-weight="750">Bounded generalization</text><text x="42.0" y="687" font-size="18" fill="#4b6078" font-weight="400">Can students justify a limit?</text><rect x="24.0" y="751" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="751" width="352.0" height="5" rx="2" fill="#52647c"/><circle cx="55.0" cy="784" r="18" fill="#52647c"/><text x="44.0" y="790" font-size="17" fill="white" font-weight="750">05</text><text x="86.0" y="789" font-size="20" fill="#142d4e" font-weight="750">Instruction + revision</text><text x="42.0" y="826" font-size="18" fill="#4b6078" font-weight="400">Can feedback change thinking?</text><rect x="24.0" y="890" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="890" width="352.0" height="5" rx="2" fill="#087f72"/><circle cx="55.0" cy="923" r="18" fill="#087f72"/><text x="44.0" y="929" font-size="17" fill="white" font-weight="750">06</text><text x="86.0" y="928" font-size="20" fill="#142d4e" font-weight="750">Individual check</text><text x="42.0" y="965" font-size="18" fill="#4b6078" font-weight="400">What will you teach next?</text><rect x="24" y="1029" width="352" height="100" rx="10" fill="#142d4e"/><text x="40" y="1058" font-size="17" fill="white" font-weight="500">Read exact passages → adjust 0–3</text><text x="40" y="1082" font-size="17" fill="white" font-weight="500">ratings → confirm → choose an</text><text x="40" y="1106" font-size="17" fill="white" font-weight="500">improvement.</text></g></svg>