<svg xmlns="http://www.w3.org/2000/svg" width="960" height="439" viewBox="0 0 960 439" role="img" aria-labelledby="title desc"><title id="title">Take the review instructions with you</title><desc id="desc">The downloadable SKILL.md carries the rubric and review procedure. Bring the document: Use the lesson plan, syllabus, or combined scope. Ask for evidence: Use exact passages and explain uncertain ratings. Check the review: Verify the reasoning before choosing a revision. Includes rating explanations, score calculations, and screen-time review guidance.</desc><rect width="960" height="439" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="32" y="63" font-size="32" fill="#142d4e" font-weight="750">Take the review instructions with you</text><text x="32" y="102" font-size="20" fill="#4b6078" font-weight="400">The downloadable SKILL.md carries the rubric and review procedure.</text><rect x="32.0" y="145" width="286.6666666666667" height="200" rx="12" fill="white" stroke="#cbd8e8"/><rect x="32.0" y="145" width="286.6666666666667" height="5" rx="2" fill="#215bc7"/><circle cx="66.0" cy="181" r="20" fill="#215bc7"/><text x="54.0" y="188" font-size="19" fill="white" font-weight="750">01</text><text x="48.0" y="228" font-size="22" fill="#142d4e" font-weight="750">Bring the document</text><text x="48.0" y="259" font-size="19" fill="#4b6078" font-weight="400">Use the lesson plan,</text><text x="48.0" y="283" font-size="19" fill="#4b6078" font-weight="400">syllabus, or combined</text><text x="48.0" y="307" font-size="19" fill="#4b6078" font-weight="400">scope.</text><rect x="336.6666666666667" y="145" width="286.6666666666667" height="200" rx="12" fill="white" stroke="#cbd8e8"/><rect x="336.6666666666667" y="145" width="286.6666666666667" height="5" rx="2" fill="#087f72"/><circle cx="370.6666666666667" cy="181" r="20" fill="#087f72"/><tex