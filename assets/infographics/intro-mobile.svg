61 L35 49 M18 48 L8 60 M23 53 L16 65"/></g><text x="42.0" y="836" font-size="13" fill="#96590b" font-weight="750">TEST IT</text><text x="42.0" y="881" font-size="18" fill="#4b6078" font-weight="400">Test a broader claim.</text><rect x="36.0" y="950" width="328.0" height="55" rx="8" fill="#edf3fc"/><text x="48.0" y="973" font-size="16" fill="#142d4e" font-weight="500">If the case changes, then… The</text><text x="48.0" y="995" font-size="16" fill="#142d4e" font-weight="500">limit is…</text><rect x="24" y="1029" width="352" height="76" rx="10" fill="#142d4e"/><text x="40" y="1058" font-size="17" fill="white" font-weight="500">A learning record makes thinking</text><text x="40" y="1082" font-size="17" fill="white" font-weight="500">visible as the work develops.</text></g></svg>