<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1129" viewBox="0 0 400 1129" role="img" aria-labelledby="title desc"><title id="title">A clearer picture of learning</title><desc id="desc">Three pauses inside an assignment you already teach. Articulate: Explain the idea. Connect: Support the relationship. Extend: Test a broader claim. A learning record makes thinking visible as the work develops.</desc><rect width="400" height="1129" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="24" y="63" font-size="26" fill="#142d4e" font-weight="750">A clearer picture of</text><text x="24" y="95" font-size="26" fill="#142d4e" font-weight="750">learning</text><text x="24" y="127" font-size="18" fill="#4b6078" font-weight="400">Three pauses inside an assignment</text><text x="24" y="152" font-size="18" fill="#4b6078" font-weight="400">you already teach.</text><rect x="24.0" y="195" width="352.0" height="266" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="195" width="352.0" height="5" rx="2" fill="#215bc7"/><rect x="24.0" y="195" width="352.0" height="52" rx="12" fill="#215bc7"/><circle cx="54.0" cy="221" r="19" fill="white"/><text x="46.0" y="228" font-size="23" fill="#215bc7" font-weight="750">A</text><text x="84.0" y="228" font-size="20" fill="white" font-weight="750">Articulate</text><g transform="translate(301.0 260) scale(0.72)" fill="none" stroke="#215bc7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M8 8 H53 Q61 8 61 17 V38 Q61 47 52 47 H29 L13 59 V47 H8 Q1 47 1 38 V17 Q1 8 8 8 Z"/><circle cx="17" cy="28" r="2"/><circle cx="31" cy="28" r="2"/><circle cx="45" cy="28" r="2"/></g><text x="42.0" y="280" font-size="13" fill="#215bc7" font-weight="750">SAY IT</text><text x="42.0" y="325" font-size="18" fill="#4b6078" font-weight="400">Explain the idea.</text><rect x="36.0" y="394" width="32