<svg xmlns="http://www.w3.org/2000/svg" width="400" height="752" viewBox="0 0 400 752" role="img" aria-labelledby="title desc"><title id="title">Account for all 45 minutes</title><desc id="desc">An illustrative lesson: projection + devices + offline work. Projection only: 10 minutes viewing a teacher display Student devices: 15 minutes using a device Offline work: 20 minutes discussing and writing Planned screen exposure: 25 minutes. Count simultaneous device/projection use once.</desc><rect width="400" height="752" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="24" y="63" font-size="26" fill="#142d4e" font-weight="750">Account for all 45 minutes</text><text x="24" y="95" font-size="18" fill="#4b6078" font-weight="400">An illustrative lesson: projection</text><text x="24" y="120" font-size="18" fill="#4b6078" font-weight="400">+ devices + offline work.</text><rect x="24" y="163" width="78.22222222222223" height="30" rx="0" fill="#215bc7"/><text x="32" y="184" font-size="14" fill="white" font-weight="700">10 min</text><rect x="102.22222222222223" y="163" width="117.33333333333333" height="30" rx="0" fill="#087f72"/><text x="110.22222222222223" y="184" font-size="14" fill="white" font-weight="700">15 min</text><rect x="219.55555555555554" y="163" width="156.44444444444446" height="30" rx="0" fill="#96590b"/><text x="227.55555555555554" y="184" font-size="14" fill="white" font-weight="700">20 min</text><rect x="24.0" y="211" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="211" width="352.0" height="5" rx="2" fill="#215bc7"/><circle cx="55.0" cy="244" r="18" fill="#215bc7"/><text x="44.0" y="250" font-size="17" fill="white" font-weight="750">10</text><text x="86.0" y="249" font-size="20" fill="#142d4e" font-weight="750">Projection only</text><text x="42.0" y="286" font-size="18" fill="#4b6078" font-weight="400">10 minutes viewing a teacher</text><text x="42.0" y="310" font-size="18" fill="#4b6078" font-weight="400">display</text><rect x="24.0" y="350" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="350" width="352.0" height="5" rx="2" fill="#087f72"/><circle cx="55.0" cy="383" r="18" fill="#087f72"/><text x="44.0" y="389" font-size="17" fill="white" font-weight="750">15</text><text x="86.0" y="388" font-size="20" fill="#142d4e" font-weight="750">Student devices</text><text x="42.0" y="425" font-size="18" fill="#4b6078" font-weight="400">15 minutes using a device</text><rect x="24.0" y="489" width="352.0" height="127" rx="12" fill="white" stroke="#cbd8e8"/><rect x="24.0" y="489" width="352.0" height="5" rx="2" fill="#96590b"/><circle cx="55.0" cy="522" r="18" fill="#96590b"/><text x="44.0" y="528" font-size="17" fill="white" font-weight="750">20</text><text x="86.0" y="527" font-size="20" fill="#142d4e" font-weight="750">Offline work</text><text x="42.0" y="564" font-size="18" fill="#4b6078" font-weight="400">20 minutes discussing and writing</text><rect x="24" y="628" width="352" height="100" rx="10" fill="#142d4e"/><text x="40" y="657" font-size="17" fill="white" font-weight="500">Planned screen exposure: 25</text><text x="40" y="681" font-size="17" fill="white" font-weight="500">minutes. Count simultaneous</text><text x="40" y="705" font-size="17" fill="white" font-weight="500">device/projection use once.</text></g></svg>