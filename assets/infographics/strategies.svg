<svg xmlns="http://www.w3.org/2000/svg" width="960" height="439" viewBox="0 0 960 439" role="img" aria-labelledby="title desc"><title id="title">Turn instructional strategies into actions</title><desc id="desc">Give students a chance to use the support you provide. Model thinking: Show how you check your reasoning. Give feedback: Name a specific move the student can make. Let students revise: Ask what improved and why. Compare cases: Ask when a principle applies and when it fails. The opportunity to act on feedback belongs inside the assignment.</desc><rect width="960" height="439" rx="18" fill="#f4f7fb" stroke="#cbd8e8"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="27" font-size="12" fill="#215bc7" font-weight="700">ACE IT / FIELD GUIDE</text><text x="32" y="63" font-size="32" fill="#142d4e" font-weight="750">Turn instructional strategies into actions</text><text x="32" y="102" font-size="20" fill="#4b6078" font-weight="400">Give students a chance to use the support you provide.</text><rect x="32.0" y="145" width="210.5" height="200" rx="12" fill="white" stroke="#cbd8e8"/><rect x="32.0" y="145" width="210.5" height="5" rx="2" fill="#215bc7"/><circle cx="66.0" cy="181" r="20" fill="#215bc7"/><text x="54.0" y="188" font-size="19" fill="white" font-weight="750">01</text><text x="48.0" y="228" font-size="22" fill="#142d4e" font-weight="750">Model thinking</text><text x="48.0" y="259" font-size="19" fill="#4b6078" font-weight="400">Show how you check</text><text x="48.0" y="283" font-size="19" fill="#4b6078" font-weight="400">your reasoning.</text><rect x="260.5" y="145" width="210.5" height="200" rx="12" fill="white" stroke="#cbd8e8"/><rect x="260.5" y="145" width="210.5" height="5" rx="2" fill="#087f72"/><circle cx="294.5" cy="181" r="20" fill="#087f72"/><text x="282.5" y="188" font-size="19" fill="white" font-weight="750">02</text><text x="276.5" y="228" font-size="22" fill="#142d4e" font-weight="750">Give feedback</text><text x="276.5" y="259" font-size="19" fill="#4b6078" font-weight="400">Name a specific</text><text x="276.5" y="283" font-size="19" fill="#4b6078" font-weight="400">move the student</text><text x="276.5" y="307" font-size="19" fill="#4b6078" font-weight="400">can make.</text><rect x="489.0" y="145" width="210.5" height="200" rx="12" fill="white" stroke="#cbd8e8"/><rect x="489.0" y="145" width="210.5" height="5" rx="2" fill="#96590b"/><circle cx="523.0" cy="181" r="20" fill="#96590b"/><text x="511.0" y="188" font-size="19" fill="white" font-weight="750">03</text><text x="505.0" y="228" font-size="22" fill="#142d4e" font-weight="750">Let students</text><text x="505.0" y="254" font-size="22" fill="#142d4e" font-weight="750">revise</text><text x="505.0" y="285" font-size="19" fill="#4b6078" font-weight="400">Ask what improved</text><text x="505.0" y="309" font-size="19" fill="#4b6078" font-weight="400">and why.</text><rect x="717.5" y="145" width="210.5" height="200" rx="12" fill="white" stroke="#cbd8e8"/><rect x="717.5" y="145" width="210.5" height="5" rx="2" fill="#6950a3"/><circle cx="751.5" cy="181" r="20" fill="#6950a3"/><text x="739.5" y="188" font-size="19" fill="white" font-weight="750">04</text><text x="733.5" y="228" font-size="22" fill="#142d4e" font-weight="750">Compare cases</text><text x="733.5" y="259" font-size="19" fill="#4b6078" font-weight="400">Ask when a</text><text x="733.5" y="283" font-size="19" fill="#4b6078" font-weight="400">principle applies</text><text x="733.5" y="307" font-size="19" fill="#4b6078" font-weight="400">and when it fails.</text><rect x="32" y="363" width="896" height="52" rx="10" fill="#142d4e"/><text x="48" y="392" font-size="17" fill="white" font-weight="500">The opportunity to act on feedback belongs inside the assignment.</text></g></svg>